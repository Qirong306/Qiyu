<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: sans-serif; padding: 30px; background: #fafafa; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .card {
    width: 140px; height: 160px; border-radius: 14px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #fff; font-weight: bold;
    box-shadow: 0 4px 12px rgba(0,0,0,.12);
  }
  .name { font-size: 20px; }
  .hex { font-size: 13px; opacity: .9; margin-top: 6px; }
</style>
</head>
<body>
  <h2>7组柔和马卡龙配色</h2>
  <div class="row">
    <div class="card" style="background:#FF6B6B"><div class="name">A组</div><div class="hex">#FF6B6B</div></div>
    <div class="card" style="background:#FFA94D"><div class="name">B组</div><div class="hex">#FFA94D</div></div>
    <div class="card" style="background:#FFD43B;color:#7a6000"><div class="name">C组</div><div class="hex">#FFD43B</div></div>
    <div class="card" style="background:#69DB7C;color:#1a5c28"><div class="name">D组</div><div class="hex">#69DB7C</div></div>
    <div class="card" style="background:#4DABF7"><div class="name">E组</div><div class="hex">#4DABF7</div></div>
    <div class="card" style="background:#9775FA"><div class="name">F组</div><div class="hex">#9775FA</div></div>
    <div class="card" style="background:#F783AC"><div class="name">G组</div><div class="hex">#F783AC</div></div>
  </div>
</body>
</html>
