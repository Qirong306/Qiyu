<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>个人学习空间</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      background: #f5f4f0;
      color: #2c2c2c;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    /* 统一容器，最大宽度模拟手机 */
    .app-container { width: 100%; max-width: 420px; position: relative; }

    /* --- 桌面小组件页面 --- */
    .desktop-view { padding: 30px 20px; }
    .widget-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-top: 40px;
    }
    .widget {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.04);
      padding: 16px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.1s;
    }
    .widget:active { transform: scale(0.98); }

    /* 大组件：日历 */
    .widget-large {
      grid-column: span 4;
      grid-row: span 2;
      background: #1c1c1e;
      color: #fff;
      padding: 20px;
    }
    .widget-large .day-number { font-size: 56px; font-weight: 300; line-height: 1; letter-spacing: -1px; }
    .widget-large .day-info { font-size: 14px; color: #aaa; margin-top: 6px; }
    .widget-large .task-tag { 
      display: inline-block; font-size: 12px; color: #fff; 
      border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; 
      padding: 4px 12px; margin-top: 16px; width: fit-content;
    }

    /* 中组件：背单词 */
    .widget-medium {
      grid-column: span 2;
      grid-row: span 1;
    }
    .widget-title { font-size: 16px; font-weight: 600; color: #1c1c1e; }
    .widget-desc { font-size: 12px; color: #888; margin-top: 4px; }
    .widget-line { 
      width: 24px; height: 2px; background: #1c1c1e; 
      margin-top: 14px; border-radius: 1px;
    }

    /* 小图标：占1列 */
    .widget-small {
      grid-column: span 1;
      align-items: center;
      justify-content: center;
      padding: 16px 8px;
    }
    .widget-small .title { font-size: 12px; color: #1c1c1e; font-weight: 600; margin-top: 4px; }

    /* --- 阅读/听书页面 --- */
    .reader-view {
      position: absolute; top: 0; left: 0; width: 100%; height: 100vh;
      background: #e8e4d9;
      display: none;
      flex-direction: column;
    }
    .reader-view.active { display: flex; }

    .reader-top {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 20px;
      font-size: 15px; color: #555;
      z-index: 10;
    }
    .reader-top .icon-btn { padding: 8px; cursor: pointer; font-size: 16px; }

    .reader-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px 32px 160px 32px;
      font-family: "Songti SC", "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.8;
      color: #3e3a35;
      text-align: justify;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><path d="M10 10 Q 50 50 100 10 T 190 10" fill="none" stroke="%23dcd6c8" stroke-width="0.5" opacity="0.4"/></svg>');
      background-repeat: repeat;
    }
    .reader-content p { margin-bottom: 1.2em; text-indent: 2em; }
    .reader-content p.active-sentence { background: rgba(200, 180, 140, 0.3); border-radius: 4px; }

    .reader-bottom {
      position: absolute; bottom: 0; left: 0; width: 100%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255,255,255,0.5);
      padding: 12px 20px 20px;
      z-index: 10;
    }
    .progress-row {
      display: flex; justify-content: space-between;
      font-size: 12px; color: #666;
      margin-bottom: 8px;
    }
    .progress-bar {
      width: 100%; height: 2px; background: rgba(0,0,0,0.1);
      border-radius: 1px; position: relative; margin-bottom: 16px;
    }
    .progress-fill {
      position: absolute; left: 0; top: 0; height: 100%; width: 0%;
      background: #555; border-radius: 1px;
    }
    .control-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 10px;
    }
    .control-btn {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(0,0,0,0.05);
      display: flex; justify-content: center; align-items: center;
      font-size: 18px; color: #333; cursor: pointer;
      user-select: none;
    }
    .control-btn:active { background: rgba(0,0,0,0.1); }
    .control-btn.play-btn { width: 56px; height: 56px; font-size: 22px; }

    .bottom-menu {
      display: flex; justify-content: space-around; align-items: center;
      margin-top: 16px; padding-top: 12px;
      border-top: 1px solid rgba(0,0,0,0.06);
    }
    .bottom-menu .icon-btn { font-size: 16px; color: #666; cursor: pointer; padding: 8px; }

    .page { display: none; }
    .page.active { display: block; }

    .vocab-view { padding: 30px 20px; }
    .vocab-card {
      background: #fff; border-radius: 20px; padding: 40px 20px;
      text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,0.04);
      margin-bottom: 20px; min-height: 300px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    .vocab-word { font-size: 36px; font-weight: 600; color: #1c1c1e; }
    .vocab-phonetic { font-size: 16px; color: #888; margin-top: 8px; }
    .vocab-meaning { font-size: 18px; color: #444; margin-top: 30px; }
    .vocab-btn {
      display: inline-block; padding: 10px 24px; margin-top: 30px;
      background: #1c1c1e; color: #fff; border-radius: 20px;
      font-size: 14px; cursor: pointer;
    }
  </style>
</head>
<body>

<div class="app-container">
  
  <!-- 1. 桌面小组件主界面 -->
  <div id="desktop" class="page active desktop-view">
    <div class="widget-grid">
      <div class="widget widget-large" onclick="goTo('calendar')">
        <div>
          <div class="day-number" id="todayDay">17</div>
          <div class="day-info" id="todayMonth">9月 星期四</div>
        </div>
        <div class="task-tag">今日任务：背 20 个单词</div>
      </div>

      <div class="widget widget-medium" onclick="goTo('vocab')">
        <div>
          <div class="widget-title">背单词</div>
          <div class="widget-desc">已学 0 / 总数 0</div>
        </div>
        <div class="widget-line"></div>
      </div>

      <div class="widget widget-small" onclick="goTo('reader')">
        <div class="widget-title">读书</div>
      </div>

      <div class="widget widget-small" onclick="goTo('settings')">
        <div class="widget-title">设置</div>
      </div>
      
      <div class="widget widget-small" onclick="goTo('stats')">
        <div class="widget-title">统计</div>
      </div>
    </div>
  </div>

  <!-- 2. 看书/听书页面 -->
  <div id="reader" class="page reader-view">
    <div class="reader-top">
      <div class="icon-btn" onclick="goTo('desktop')">&lt; 返回</div>
      <div style="display: flex; gap: 16px;">
        <div class="icon-btn" onclick="alert('听书开关')">听</div>
        <div class="icon-btn" onclick="alert('自动播放切换')">播</div>
        <div class="icon-btn" onclick="alert('搜索')">搜</div>
      </div>
    </div>

    <div class="reader-content" id="readerText"></div>

    <div class="reader-bottom">
      <div class="progress-row">
        <span id="timeElapsed">本次时长 0 秒</span>
        <span id="timeRemaining">读完剩余 0 分</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="control-row">
        <div class="control-btn" onclick="prevSentence()">&lt;</div>
        <div class="control-btn play-btn" id="playBtn" onclick="togglePlay()">■</div>
        <div class="control-btn" onclick="nextSentence()">&gt;</div>
      </div>
      <div class="bottom-menu">
        <div class="icon-btn" onclick="goTo('desktop')">目录</div>
        <div class="icon-btn" onclick="alert('字号调节')">字号</div>
        <div class="icon-btn" onclick="alert('背景色切换')">背景</div>
      </div>
    </div>
  </div>

  <!-- 3. 背单词页面 -->
  <div id="vocab" class="page vocab-view">
    <div style="margin-bottom: 20px; cursor: pointer; font-size: 15px; color: #666;" onclick="goTo('desktop')">&lt; 返回桌面</div>
    <div class="vocab-card">
      <div class="vocab-word" id="vocabWord">Hello</div>
      <div class="vocab-phonetic" id="vocabPhonetic">/həˈloʊ/</div>
      <div class="vocab-meaning" id="vocabMeaning">int. 喂；哈罗</div>
      <div class="vocab-btn" onclick="speakWord()">朗读单词</div>
    </div>
    <div style="display: flex; justify-content: space-between; color: #666; font-size: 14px;">
      <span onclick="alert('上一个')">&lt; 上一个</span>
      <span onclick="alert('标记已掌握')">已掌握</span>
      <span onclick="alert('下一个')">下一个 &gt;</span>
    </div>
  </div>

</div>

<script>
// ==================== 1. MiMo 配置 ====================
const MIMO_CONFIG = {
  // 你截图里的 API Key，注意：如果报 401，可能需要换成 Token Plan 的 tp- 密钥
  apiKey: 'sk-ci1olyd8rbmef1ajl32fxldqszh5kcap1s8oxqtwqn4eef9b',
  model: 'mimo-v2.5-tts-voiceclone',
  // 先留空，使用默认预置音色跑通流程。有样本后再替换成 Base64 字符串
  voiceSampleBase64: '' 
};

// ==================== 2. 核心 speak 函数 ====================
async function speak(text, scene = 'reading') {
  if (!MIMO_CONFIG.apiKey) {
    console.warn('请先填入 MiMo API Key');
    return;
  }

  try {
    const response = await fetch('https://api.xiaomimimo.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'api-key': MIMO_CONFIG.apiKey,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: MIMO_CONFIG.model,
        messages: [
          { role: 'user', content: '' },
          { role: 'assistant', content: text }
        ],
        audio: {
          format: 'wav',
          // 有样本用样本，没样本用默认音色
          voice: MIMO_CONFIG.voiceSampleBase64
            ? `data:audio/wav;base64,${MIMO_CONFIG.voiceSampleBase64}`
            : 'qi_yu_0306'
        }
      })
    });

    const data = await response.json();
    
    if (!data.choices || !data.choices[0].message.audio) {
      console.error('返回数据格式不对，检查API Key或模型名:', data);
      return;
    }

    // 解码 Base64 音频
    const audioBase64 = data.choices[0].message.audio.data;
    const audioBytes = atob(audioBase64);
    const arrayBuffer = new ArrayBuffer(audioBytes.length);
    const uint8Array = new Uint8Array(arrayBuffer);
    for (let i = 0; i < audioBytes.length; i++) {
      uint8Array[i] = audioBytes.charCodeAt(i);
    }

    // 播放
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
    const source = audioCtx.createBufferSource();
    source.buffer = audioBuffer;
    source.connect(audioCtx.destination);
    
    return new Promise((resolve) => {
      source.onended = () => {
        audioCtx.close();
        resolve();
      };
      source.start(0);
    });

  } catch (error) {
    console.error('TTS 请求失败:', error);
  }
}

// ==================== 3. 音频样本转 Base64 工具 ====================
async function fileToBase64(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.readAsDataURL(file);
  });
}

window.addEventListener('drop', async (e) => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file) {
    const base64 = await fileToBase64(file);
    console.log('你的声音样本 Base64：', base64);
    // 复制这串字符，粘贴到 MIMO_CONFIG.voiceSampleBase64 里
  }
});

// ==================== 4. 日历初始化 ====================
const now = new Date();
document.getElementById('todayDay').textContent = now.getDate();
const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const weekNames = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
document.getElementById('todayMonth').textContent = `${monthNames[now.getMonth()]} ${weekNames[now.getDay()]}`;

// ==================== 5. 页面路由切换 ====================
function goTo(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  if (pageId === 'desktop') {
    document.getElementById('desktop').classList.add('active');
  } else if (pageId === 'reader') {
    document.getElementById('reader').classList.add('active');
    initReader();
  } else if (pageId === 'vocab') {
    document.getElementById('vocab').classList.add('active');
  }
}

// ==================== 6. 阅读器逻辑 ====================
let sentences = [];
let currentIndex = -1;
let isPlaying = false;

const sampleText = `本书仅限在中国大陆地区发行销售。地球上最伟大的表演。著者：理查德·道金斯。译者：李虎 徐双悦。策划推广：中信出版社。出版发行：中信出版集团股份有限公司。北京市朝阳区惠新东街甲4号富盛大厦2座 邮编 100029。字数：290千字。本次时长 1 秒。读完剩余 27 分。京权图字：01-2010-4852。`;

function initReader() {
  const textContainer = document.getElementById('readerText');
  if (sentences.length === 0) {
    sentences = sampleText.split(/(?<=[。！？])/).filter(s => s.trim().length > 0);
    textContainer.innerHTML = sentences.map((s, i) => `<p id="sent-${i}">${s}</p>`).join('');
  }
}

function updateHighlight() {
  document.querySelectorAll('.reader-content p').forEach(p => p.classList.remove('active-sentence'));
  if (currentIndex >= 0 && currentIndex < sentences.length) {
    const el = document.getElementById(`sent-${currentIndex}`);
    if (el) {
      el.classList.add('active-sentence');
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    const percent = ((currentIndex + 1) / sentences.length) * 100;
    document.getElementById('progressFill').style.width = percent + '%';
    document.getElementById('timeElapsed').textContent = `本次时长 ${currentIndex + 1} 秒`;
    const remaining = Math.ceil((sentences.length - currentIndex - 1) * 0.5);
    document.getElementById('timeRemaining').textContent = `读完剩余 ${remaining} 分`;
  }
}

async function nextSentence() {
  if (currentIndex < sentences.length - 1) {
    currentIndex++;
    updateHighlight();

    if (isPlaying) {
      const text = sentences[currentIndex];
      console.log("朗读:", text);
      await speak(text, 'reading');
      
      if (isPlaying) {
        nextSentence();
      }
    }
  } else {
    isPlaying = false;
    document.getElementById('playBtn').textContent = '■';
  }
}

function prevSentence() {
  if (currentIndex > 0) {
    currentIndex--;
    updateHighlight();
  }
}

function togglePlay() {
  isPlaying = !isPlaying;
  const btn = document.getElementById('playBtn');
  if (isPlaying) {
    btn.textContent = '||';
    if (currentIndex === -1) nextSentence();
  } else {
    btn.textContent = '■';
  }
}

// ==================== 7. 背单词逻辑 ====================
const vocabData = [
  { word: "Hello", phonetic: "/həˈloʊ/", meaning: "int. 喂；哈罗" },
  { word: "World", phonetic: "/wɜːrld/", meaning: "n. 世界；领域" },
  { word: "Evolution", phonetic: "/ˌiːvəˈluːʃn/", meaning: "n. 进化；演变" }
];
let vocabIndex = 0;

async function speakWord() {
  const word = document.getElementById('vocabWord').textContent;
  await speak(word, 'vocab');
}
</script>
</body>
</html>
